<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Flashdrive Home</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Segoe UI", "Leelawadee UI", sans-serif; color: #fff; user-select: none; }
  body { background: radial-gradient(circle at 20% 10%, #4f46e5, transparent 50%), radial-gradient(circle at 90% 90%, #db2777, transparent 45%), #0f172a; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }

  /* wallpaper: two layers cross-fade for the slideshow */
  .wp { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s; }

  .status { display: flex; justify-content: space-between; padding: 8px 20px; font-size: 14px; text-shadow: 0 1px 3px #000a; }
  .clock { text-align: center; margin: 24px 0 12px; text-shadow: 0 2px 8px #0008; }
  .clock b { display: block; font-size: 64px; font-weight: 300; }
  .search { display: block; width: min(560px, 90%); margin: 0 auto 20px; padding: 12px 20px; border-radius: 999px; border: 0; font: inherit; font-size: 16px; background: #ffffffe6; color: #111; outline: none; }

  .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 20px 8px; align-content: start; padding: 8px 32px 24px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 4px; border-radius: 16px; }
  .app:hover, .app:focus-visible { background: #ffffff22; outline: none; }
  .app:active { transform: scale(.94); }
  .icon { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; font-weight: 600; color: #4f46e5; background: #ffffffee; box-shadow: 0 4px 12px #0005; overflow: hidden; }
  .icon img { width: 48px; height: 48px; }
  .app span { font-size: 13px; text-align: center; text-shadow: 0 1px 3px #000c; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { grid-column: 1 / -1; text-align: center; opacity: .8; padding: 40px; }

  .dock { display: flex; justify-content: center; gap: 24px; margin: 0 auto 16px; padding: 10px 28px; border-radius: 28px; background: #ffffff2e; backdrop-filter: blur(16px); }
  .dock .app span { display: none; }

  /* full-screen "apps" (gallery, music, ...) like Android activities */
  .screen { position: fixed; inset: 0; background: #111; display: none; flex-direction: column; }
  .screen.open { display: flex; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #1c1c1e; font-size: 18px; flex-wrap: wrap; }
  .bar button { font-size: 15px; height: 40px; padding: 0 14px; border-radius: 20px; }
  .bar button:hover:not(:disabled) { background: #ffffff22; }
  .bar .back { font-size: 24px; width: 40px; padding: 0; }
  .bar small { opacity: .6; font-size: 14px; margin-right: auto; }
  .bar b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
  .selbar { background: #1e3a8a; }
  .selbar .primary { background: #fff; color: #1e3a8a; }
  .content { flex: 1; overflow-y: auto; padding-bottom: 96px; } /* room for the mini player */

  .albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; padding: 16px; align-content: start; }
  .album { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 0; }
  .album .cover { width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #2a2a2e; display: grid; place-items: center; font-size: 56px; }
  .album .cover img { width: 100%; height: 100%; object-fit: cover; }
  .album.music .cover { background: linear-gradient(135deg, #7c3aed, #db2777); }
  .album:hover .cover { outline: 3px solid #ffffff55; }
  .album b { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .album small { opacity: .6; font-size: 13px; }

  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 3px; padding: 3px; align-content: start; }
  .ph { position: relative; cursor: pointer; }
  .ph img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; display: block; }
  .ph.sel img { outline: 4px solid #3b82f6; outline-offset: -4px; opacity: .75; }
  .ph.sel::after { content: "✓"; position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: #3b82f6; display: grid; place-items: center; font-weight: 700; }

  .tracks { list-style: none; margin: 0; padding: 8px 0; }
  .tracks li { display: flex; align-items: center; gap: 16px; padding: 12px 24px; cursor: pointer; }
  .tracks li:hover { background: #ffffff12; }
  .tracks li.playing { color: #a78bfa; }
  .tracks li .n { width: 28px; text-align: right; opacity: .5; font-size: 14px; }
  .tracks li .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tracks li small { opacity: .5; }

  .viewer { position: fixed; inset: 0; background: #000; display: none; place-items: center; }
  .viewer.open { display: grid; }
  .viewer img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  .viewer button { position: absolute; font-size: 40px; width: 64px; height: 64px; border-radius: 50%; background: #0006; }
  .viewer .prev { left: 16px; } .viewer .next { right: 16px; }
  .viewer .close { top: 16px; right: 16px; font-size: 28px; }
  .viewer .setwp { top: 16px; right: 96px; width: auto; height: 48px; padding: 0 18px; border-radius: 24px; font-size: 15px; }
  .viewer .cap { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 14px; opacity: .8; }

  /* mini music player, bottom-right on every screen */
  .player { position: fixed; right: 16px; bottom: 16px; z-index: 100; width: 400px; padding: 12px 16px; border-radius: 20px; background: #1f1b2ecc; backdrop-filter: blur(20px); box-shadow: 0 8px 32px #0008; display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: center; }
  .player .art { grid-row: span 2; width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #7c3aed, #db2777); display: grid; place-items: center; font-size: 22px; }
  .player .art.spin { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.9); } }
  .player .info { min-width: 0; }
  .player .info b, .player .info small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .info b { font-weight: 500; font-size: 14px; }
  .player .info small { opacity: .65; font-size: 12px; }
  .player .x { font-size: 14px; opacity: .6; width: 28px; height: 28px; border-radius: 50%; }
  .player .ctl { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; }
  .player .ctl button { width: 34px; height: 34px; border-radius: 50%; font-size: 16px; }
  .player .ctl button:hover, .player .x:hover { background: #ffffff22; }
  .player .ctl .pp { background: #fff; color: #1f1b2e; }
  .player input { flex: 1; accent-color: #a78bfa; min-width: 0; }
  .player time { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }

  .player .pbtns { display: flex; }
  .player .info * { pointer-events: none; } /* let drags reach the drag region */

  /* folded: the window itself is the mini player (always on top, screen's right edge) */
  body.mini { background: #1f1b2e; }
  body.mini > :not(#player) { display: none !important; }
  body.mini .player { inset: 0; width: auto; border-radius: 0; box-shadow: none; background: #1f1b2e; padding: 12px 14px; }
  body.mini .player .info, body.mini .player .art { cursor: grab; }

  /* video: same player, video on top; .big = full screen inside the app */
  .player video { display: none; }
  .player .video-only, .player .hasvideo-only { display: none; }
  .player.hasvideo .hasvideo-only { display: inline-block; }
  .player.video { width: 440px; grid-template-columns: 1fr auto; grid-template-rows: auto auto auto; }
  .player.video video { display: block; grid-column: 1 / -1; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; cursor: pointer; min-height: 0; }
  .player.video .art { display: none; }
  .player.video .ctl { grid-column: 1 / -1; }
  .player.video .video-only { display: inline-block; }
  .player.video.big, body.mini .player.video { grid-template-rows: 1fr auto auto; }
  .player.video.big { inset: 0; width: auto; border-radius: 0; background: #000; padding: 0 24px 16px; }
  .player.video.big video, body.mini .player.video video { height: 100%; aspect-ratio: auto; object-fit: contain; border-radius: 0; }
  body.mini .player.video { padding: 0 12px 8px; background: #000; }
  body.mini .player .video-only { display: none; }

  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 16px; align-content: start; }
  .clip { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .clip video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #222; border-radius: 10px; pointer-events: none; }
  .clip span { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip:hover video { outline: 3px solid #ffffff55; }
  .clip.playing span { color: #a78bfa; }
  .clip.playing video { outline: 3px solid #a78bfa; }
  .album.video .cover { background: linear-gradient(135deg, #0ea5e9, #6366f1); }

  .player .ctl .sm { width: 30px; height: 30px; font-size: 14px; opacity: .55; }
  .player .ctl .sm.on { opacity: 1; background: #a78bfa44; }
  body.mini #pQueue { display: none; }

  .queue { position: fixed; right: 16px; z-index: 101; width: 400px; max-height: 50vh; display: flex; flex-direction: column; border-radius: 16px; background: #1f1b2ef2; backdrop-filter: blur(20px); box-shadow: 0 8px 32px #0008; overflow: hidden; }
  .queue .qhead { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #ffffff1a; }
  .queue .qhead b { font-weight: 500; font-size: 14px; }
  .queue .qhead button { font-size: 13px; opacity: .7; padding: 4px 10px; border-radius: 12px; }
  .queue .qhead button:hover { background: #ffffff22; opacity: 1; }
  .queue ol { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; }
  .queue li { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  .queue li:hover { background: #ffffff12; }
  .queue li.playing { color: #a78bfa; }
  .queue li .n { width: 22px; text-align: right; opacity: .5; font-size: 12px; }
  .queue li .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue li .x { opacity: .5; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; }
  .queue li .x:hover { opacity: 1; background: #ffffff22; }

  .addq { width: 32px; height: 32px; border-radius: 50%; font-size: 18px; opacity: .5; flex: none; }
  .addq:hover { opacity: 1; background: #ffffff22; }
  .clip { position: relative; }
  .clip .addq { position: absolute; top: 8px; right: 8px; background: #000a; opacity: .85; }

  .toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 200; background: #000c; padding: 10px 20px; border-radius: 999px; font-size: 14px; transition: opacity .3s; }
</style>
</head>
<body>
  <div class="wp" id="wp0"></div><div class="wp" id="wp1"></div>

  <div class="status"><span id="time"></span><span id="drive"></span></div>
  <div class="clock"><b id="big"></b><span id="date"></span></div>
  <input class="search" id="q" placeholder="🔍 ค้นหาแอป" aria-label="ค้นหาแอป">
  <main class="grid" id="grid"><p class="empty">กำลังค้นหาแอปในแฟลชไดรฟ์…</p></main>
  <nav class="dock">
    <button class="app" id="openGallery" title="แกลเลอรี"><div class="icon">🖼️</div><span>แกลเลอรี</span></button>
    <button class="app" id="openMusic" title="เพลง"><div class="icon">🎵</div><span>เพลง</span></button>
    <button class="app" id="openVideos" title="วิดีโอ"><div class="icon">🎬</div><span>วิดีโอ</span></button>
    <button class="app" id="openFiles" title="ไฟล์"><div class="icon">📁</div><span>ไฟล์</span></button>
    <button class="app" id="refresh" title="รีเฟรช"><div class="icon">🔄</div><span>รีเฟรช</span></button>
  </nav>

  <section class="screen" id="gallery">
    <div class="bar"><button class="back" aria-label="กลับ">←</button><b>แกลเลอรี</b><small id="galleryCount"></small>
      <button id="resetWp" title="กลับไปใช้พื้นหลังเริ่มต้น">↺ วอลเปเปอร์เริ่มต้น</button></div>
    <div class="content"><div class="albums" id="galleryAlbums"></div></div>
  </section>

  <section class="screen" id="album">
    <div class="bar"><button class="back" aria-label="กลับ">←</button><b id="albumTitle"></b><small id="albumCount"></small>
      <button id="albumFolder">📂 เปิดโฟลเดอร์</button><button id="selectBtn">☑ เลือกทำวอลเปเปอร์</button></div>
    <div class="bar selbar" id="selbar" hidden><small id="selCount"></small>
      <button id="selAll">เลือกทั้งหมด</button><button id="setSlide" class="primary">🖼 ตั้งเป็นวอลเปเปอร์</button></div>
    <div class="content"><div class="photos" id="photos"></div></div>
  </section>

  <section class="screen" id="music">
    <div class="bar"><button class="back" aria-label="กลับ">←</button><b>เพลง</b><small id="musicCount"></small></div>
    <div class="content"><div class="albums" id="musicAlbums"></div></div>
  </section>

  <section class="screen" id="tracks">
    <div class="bar"><button class="back" aria-label="กลับ">←</button><b id="tracksTitle"></b><small id="tracksCount"></small>
      <button id="playAll">▶ เล่นทั้งหมด</button><button id="shuffle">🔀 สุ่ม</button><button id="tracksFolder">📂 เปิดโฟลเดอร์</button></div>
    <div class="content"><ol class="tracks" id="trackList"></ol></div>
  </section>

  <section class="screen" id="videosScreen">
    <div class="bar"><button class="back" aria-label="กลับ">←</button><b>วิดีโอ</b><small id="videosCount"></small></div>
    <div class="content"><div class="albums" id="videoAlbums"></div></div>
  </section>

  <section class="screen" id="clips">
    <div class="bar"><button class="back" aria-label="กลับ">←</button><b id="clipsTitle"></b><small id="clipsCount"></small>
      <button id="clipsFolder">📂 เปิดโฟลเดอร์</button></div>
    <div class="content"><div class="clips" id="clipGrid"></div></div>
  </section>

  <div class="viewer" id="viewer">
    <img id="viewImg" alt="">
    <button class="prev" id="vPrev" aria-label="ก่อนหน้า">‹</button>
    <button class="next" id="vNext" aria-label="ถัดไป">›</button>
    <button class="setwp" id="vWp">🖼 ตั้งเป็นวอลเปเปอร์</button>
    <button class="close back" aria-label="ปิด">✕</button>
    <div class="cap" id="cap"></div>
  </div>

  <div class="player" id="player" hidden>
    <video id="media" playsinline title="คลิกเพื่อเล่น/หยุด · ดับเบิลคลิกเพื่อขยาย"></video>
    <div class="art" id="pArt" data-tauri-drag-region>🎵</div>
    <div class="info" data-tauri-drag-region><b id="pTitle"></b><small id="pAlbum"></small></div>
    <div class="pbtns"><button class="x hasvideo-only" id="pVideo" title="ซ่อนภาพ ฟังแต่เสียง" aria-label="แสดง/ซ่อนภาพวิดีโอ">🙈</button><button class="x video-only" id="pBig" title="ขยายวิดีโอเต็มจอ" aria-label="ขยายวิดีโอ">⛶</button><button class="x" id="pMini" title="พับเป็นมินิเพลเยอร์ที่ขอบจอ" aria-label="พับเป็นมินิเพลเยอร์">⇲</button><button class="x" id="pClose" title="ปิดเพลง" aria-label="ปิดเพลง">✕</button></div>
    <div class="ctl">
      <button id="pPrev" aria-label="ก่อนหน้า">⏮</button>
      <button id="pPlay" class="pp" aria-label="เล่น/หยุด">⏸</button>
      <button id="pNext" aria-label="ถัดไป">⏭</button>
      <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="ตำแหน่งเพลง">
      <time id="pTime">0:00</time>
      <button id="pRepeat" class="sm" aria-label="วนซ้ำ">🔁</button>
      <button id="pQueue" class="sm" title="คิว" aria-label="คิว">☰</button>
    </div>
  </div>
  <div class="queue" id="queue" hidden>
    <div class="qhead"><b id="queueCount"></b><button id="queueClear">ล้างคิว</button></div>
    <ol id="queueList"></ol>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
