<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Flashdrive Home</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Segoe UI", "Leelawadee UI", sans-serif; color: #fff; user-select: none; }
  body { background: radial-gradient(circle at 20% 10%, #4f46e5, transparent 50%), radial-gradient(circle at 90% 90%, #db2777, transparent 45%), #0f172a; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }
  .sprite { display: none; }
  .ic { width: 1.25em; height: 1.25em; fill: currentColor; flex: none; vertical-align: -0.25em; pointer-events: none; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .app { justify-content: flex-start; }

  /* wallpaper: two layers cross-fade for the slideshow */
  .wp { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s; }

  .status { display: flex; justify-content: space-between; padding: 8px 20px; font-size: 14px; text-shadow: 0 1px 3px #000a; }
  .clock { text-align: center; margin: 24px 0 12px; text-shadow: 0 2px 8px #0008; }
  .clock b { display: block; font-size: 64px; font-weight: 300; }
  .search { display: flex; align-items: center; gap: 10px; width: min(560px, 90%); margin: 0 auto 20px; padding: 0 20px; border-radius: 999px; background: #ffffffe6; color: #555; }
  .search input { flex: 1; min-width: 0; padding: 12px 0; border: 0; font: inherit; font-size: 16px; background: none; color: #111; outline: none; }

  .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 20px 8px; align-content: start; padding: 8px 32px 24px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 4px; border-radius: 16px; }
  .app:hover, .app:focus-visible { background: #ffffff22; outline: none; }
  .app:active { transform: scale(.94); }
  .icon { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; font-weight: 600; color: #4f46e5; background: #ffffffee; box-shadow: 0 4px 12px #0005; overflow: hidden; }
  .icon img { width: 48px; height: 48px; }
  .icon .ic { width: 38px; height: 38px; }
  #openGallery .icon { color: #db2777; } #openMusic .icon { color: #7c3aed; } #openVideos .icon { color: #0284c7; }
  #openFiles .icon { color: #d97706; } #refresh .icon { color: #059669; }
  .app span { font-size: 13px; text-align: center; text-shadow: 0 1px 3px #000c; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { grid-column: 1 / -1; text-align: center; opacity: .8; padding: 40px; }

  .dock { display: flex; justify-content: center; gap: 24px; margin: 0 auto 16px; padding: 10px 28px; border-radius: 28px; background: #ffffff2e; backdrop-filter: blur(16px); }
  .dock .app span { display: none; }

  /* full-screen "apps" (gallery, music, ...) like Android activities */
  .screen { position: fixed; inset: 0; background: #111; display: none; flex-direction: column; }
  .screen.open { display: flex; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #1c1c1e; font-size: 18px; flex-wrap: wrap; }
  .bar button { font-size: 15px; height: 40px; padding: 0 14px; border-radius: 20px; }
  .bar button:hover:not(:disabled) { background: #ffffff22; }
  .bar .back { width: 40px; padding: 0; }
  .bar .back .ic { width: 22px; height: 22px; }
  .bar small { opacity: .6; font-size: 14px; margin-right: auto; }
  .bar b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
  .selbar { background: #1e3a8a; }
  .selbar .primary { background: #fff; color: #1e3a8a; }
  #pkHere { background: #7c3aed; } #pkHere:disabled { opacity: .4; }
  .album.folder .cover { background: #2a2a2e; }
  .content { flex: 1; overflow-y: auto; padding-bottom: 96px; } /* room for the mini player */

  .albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; padding: 16px; align-content: start; }
  .album { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 0; }
  .album .cover { width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #2a2a2e; display: grid; place-items: center; font-size: 56px; }
  .album .cover .ic { width: 64px; height: 64px; color: #fff; }
  .album .cover img { width: 100%; height: 100%; object-fit: cover; }
  .album.music .cover { background: linear-gradient(135deg, #7c3aed, #db2777); }
  .album:hover .cover { outline: 3px solid #ffffff55; }
  .album b { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .album small { opacity: .6; font-size: 13px; }

  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 3px; padding: 3px; align-content: start; }
  /* ponytail: off-screen tiles skip layout/paint; originals still decoded as thumbnails, make real thumbnails if big photos still stutter */
  .ph { position: relative; cursor: pointer; content-visibility: auto; contain-intrinsic-size: auto 160px; }
  .album { content-visibility: auto; contain-intrinsic-size: auto 220px; }
  .ph img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; display: block; }
  .ph.sel img { outline: 4px solid #3b82f6; outline-offset: -4px; opacity: .75; }
  .ph.sel::after { content: "✓"; position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: #3b82f6; display: grid; place-items: center; font-weight: 700; }

  .tracks { list-style: none; margin: 0; padding: 8px 0; }
  .tracks li { display: flex; align-items: center; gap: 16px; padding: 12px 24px; cursor: pointer; }
  .tracks li:hover { background: #ffffff12; }
  .tracks li.playing { color: #a78bfa; }
  .tracks li .n { width: 28px; text-align: right; opacity: .5; font-size: 14px; }
  .tracks li .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tracks li small { opacity: .5; }

  .viewer { position: fixed; inset: 0; background: #000; display: none; place-items: center; }
  .viewer.open { display: grid; }
  .viewer img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  .viewer button .ic { width: 32px; height: 32px; }
  .viewer .setwp .ic { width: 20px; height: 20px; }
  .viewer button { position: absolute; font-size: 40px; width: 64px; height: 64px; border-radius: 50%; background: #0006; }
  .viewer .prev { left: 16px; } .viewer .next { right: 16px; }
  .viewer .close { top: 16px; right: 16px; font-size: 28px; }
  .viewer .setwp { top: 16px; right: 96px; width: auto; height: 48px; padding: 0 18px; border-radius: 24px; font-size: 15px; }
  .viewer .cap { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 14px; opacity: .8; }

  /* mini music player, bottom-right on every screen */
  .player { position: fixed; right: 16px; bottom: 16px; z-index: 100; width: 400px; padding: 12px 16px; border-radius: 20px; background: #1f1b2ecc; backdrop-filter: blur(20px); box-shadow: 0 8px 32px #0008; display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: center; }
  .player .art { grid-row: span 2; width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #7c3aed, #db2777); display: grid; place-items: center; }
  .player .art .ic { width: 26px; height: 26px; color: #fff; }
  .player .art.spin { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.9); } }
  .player .info { min-width: 0; }
  .player .info b, .player .info small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .info b { font-weight: 500; font-size: 14px; }
  .player .info small { opacity: .65; font-size: 12px; }
  .player .x .ic { width: 16px; height: 16px; }
  .player .ctl .ic { width: 18px; height: 18px; }
  .player .x { font-size: 14px; opacity: .6; width: 28px; height: 28px; border-radius: 50%; }
  .player .ctl { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; }
  .player .ctl button { width: 34px; height: 34px; border-radius: 50%; font-size: 16px; }
  .player .ctl button:hover, .player .x:hover { background: #ffffff22; }
  .player .ctl .pp, .player .ctl .pp:hover { background: #fff; color: #1f1b2e; }
  .player input { flex: 1; accent-color: #a78bfa; min-width: 0; }
  .player time { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }

  .player .pbtns { display: flex; }
  .player .info * { pointer-events: none; } /* let drags reach the drag region */

  /* folded: the window itself is the mini player (always on top, screen's right edge) */
  body.mini { background: #1f1b2e; }
  body.mini > :not(#player) { display: none !important; }
  body.mini .player { inset: 0; width: auto; border-radius: 0; box-shadow: none; background: #1f1b2e; padding: 12px 14px; }
  body.mini .player .info, body.mini .player .art { cursor: grab; }

  /* video: same player, video on top; .big = full screen inside the app */
  .player video { display: none; }
  .player .video-only, .player .hasvideo-only { display: none; }
  .player.hasvideo .hasvideo-only { display: inline-block; }
  .player.video { width: 440px; grid-template-columns: 1fr auto; grid-template-rows: auto auto auto; }
  .player.video video { display: block; grid-column: 1 / -1; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; cursor: pointer; min-height: 0; }
  .player.video .art { display: none; }
  .player.video .ctl { grid-column: 1 / -1; }
  .player.video .video-only { display: inline-block; }
  .player.video.big, body.mini .player.video { grid-template-rows: 1fr auto auto; }
  .player.video.big { inset: 0; width: auto; border-radius: 0; background: #000; padding: 0 24px 16px; }
  .player.video.big video, body.mini .player.video video { height: 100%; aspect-ratio: auto; object-fit: contain; border-radius: 0; }
  body.mini .player.video { padding: 0 12px 8px; background: #000; }
  body.mini .player .video-only { display: none; }

  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 16px; align-content: start; }
  .clip { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .clip video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #222; border-radius: 10px; pointer-events: none; }
  .clip span { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip:hover video { outline: 3px solid #ffffff55; }
  .clip.playing span { color: #a78bfa; }
  .clip.playing video { outline: 3px solid #a78bfa; }
  .album.video .cover { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
  .album.video .cover video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  .player .ctl .sm { width: 30px; height: 30px; font-size: 14px; opacity: .55; }
  .player .ctl .sm.on { opacity: 1; background: #a78bfa44; }
  body.mini #pQueue { display: none; }

  .queue { position: fixed; right: 16px; z-index: 101; width: 400px; max-height: 50vh; display: flex; flex-direction: column; border-radius: 16px; background: #1f1b2ef2; backdrop-filter: blur(20px); box-shadow: 0 8px 32px #0008; overflow: hidden; }
  .queue .qhead { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #ffffff1a; }
  .queue .qhead b { font-weight: 500; font-size: 14px; }
  .queue .qhead button { font-size: 13px; opacity: .7; padding: 4px 10px; border-radius: 12px; }
  .queue .qhead button:hover { background: #ffffff22; opacity: 1; }
  .queue ol { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; }
  .queue li { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  .queue li:hover { background: #ffffff12; }
  .queue li.playing { color: #a78bfa; }
  .queue li .n .ic, .queue li .t .ic { width: 14px; height: 14px; }
  .queue li .n { width: 22px; text-align: right; opacity: .5; font-size: 12px; }
  .queue li .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue li .x { opacity: .5; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; }
  .queue li .x:hover { opacity: 1; background: #ffffff22; }

  .addq .ic { width: 18px; height: 18px; }
  .addq { width: 32px; height: 32px; border-radius: 50%; font-size: 18px; opacity: .5; flex: none; }
  .addq:hover { opacity: 1; background: #ffffff22; }
  .clip { position: relative; }
  .clip .addq { position: absolute; top: 8px; right: 8px; background: #000a; opacity: .85; }

  #openSettings .icon { color: #475569; }
  .settings { max-width: 760px; width: 100%; margin: 0 auto; padding: 8px 24px 96px; }
  .settings h3 { font-size: 13px; font-weight: 500; letter-spacing: .04em; color: #a78bfa; margin: 28px 0 8px; }
  .settings .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 0; border-bottom: 1px solid #ffffff14; cursor: default; }
  .settings .row b { display: block; font-weight: 500; }
  .settings .row small { display: block; opacity: .6; font-size: 13px; margin-top: 4px; }
  .settings select { font: inherit; color: #fff; background: #2a2a2e; border: 1px solid #ffffff2a; border-radius: 10px; padding: 8px 12px; }
  .switch { appearance: none; flex: none; width: 48px; height: 28px; border-radius: 14px; background: #3f3f46; position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch:checked { background: #7c3aed; }
  .switch:checked::after { transform: translateX(20px); }
  .switch:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
  /* a little monitor with 6 spots to pick from */
  .screenpick { flex: none; position: relative; width: 176px; height: 110px; border: 3px solid #52525b; border-radius: 8px; background: #18181b; }
  .screenpick button { position: absolute; width: 44px; height: 18px; border-radius: 4px; background: #3f3f46; padding: 0; }
  .screenpick button:hover { background: #71717a; }
  .screenpick button.on { background: #a78bfa; }
  .screenpick [data-pos="tl"] { left: 6px; top: 6px; } .screenpick [data-pos="tr"] { right: 6px; top: 6px; }
  .screenpick [data-pos="l"] { left: 6px; top: 43px; } .screenpick [data-pos="r"] { right: 6px; top: 43px; }
  .screenpick [data-pos="bl"] { left: 6px; bottom: 6px; } .screenpick [data-pos="br"] { right: 6px; bottom: 6px; }

  /* overlay tucked into the screen edge: only a colored strip is visible */
  body.mini.peek #player::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 14px; z-index: 5; background: linear-gradient(#7c3aed, #db2777); }
  body.mini.peek.side-l #player::before { left: auto; right: 0; }

  /* file browser */
  .crumbs { display: flex; align-items: center; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
  .bar .crumbs button { height: 32px; padding: 0 8px; font-size: 15px; border-radius: 8px; flex: none; }
  .crumbs button:last-child { font-weight: 600; }
  .crumbs > .ic { width: 14px; height: 14px; opacity: .4; }
  .fwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .flist { overflow-y: auto; padding-bottom: 110px; }
  .fhead, .frow { display: grid; grid-template-columns: 36px minmax(0, 1fr) 100px 170px; align-items: center; gap: 10px; padding: 0 16px; }
  .fhead { position: sticky; top: 0; z-index: 1; height: 40px; background: #161618; border-bottom: 1px solid #ffffff14; font-size: 13px; }
  .fhead button { justify-content: flex-start; height: 100%; opacity: .6; padding: 0; }
  .fhead button.on { opacity: 1; color: #a78bfa; }
  .fhead button:nth-child(3) { justify-content: flex-end; }
  .frow { height: 44px; margin: 2px 8px; border-radius: 8px; cursor: pointer; }
  .frow:hover { background: #ffffff0f; }
  .frow.sel, .frow:focus-visible { background: #7c3aed33; outline: none; }
  .frow > .ic { width: 26px; height: 26px; }
  .frow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .sz { text-align: right; font-size: 13px; opacity: .7; font-variant-numeric: tabular-nums; }
  .frow .dt { font-size: 13px; opacity: .5; }
  .finfo { overflow-y: auto; padding: 20px 20px 150px; background: #141416; border-left: 1px solid #ffffff14; }
  .finfo .hd { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .finfo .hd .ic { width: 48px; height: 48px; }
  .finfo .hd b { font-size: 17px; font-weight: 600; word-break: break-word; }
  .finfo h4 { font-size: 12px; font-weight: 500; letter-spacing: .04em; color: #a78bfa; margin: 22px 0 10px; }
  .finfo .muted { opacity: .6; font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #ffffff0d; border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat small { opacity: .6; font-size: 12px; }
  .meter { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #ffffff1a; margin-bottom: 8px; }
  .meter span { height: 100%; }
  .legend { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .legend li { display: grid; grid-template-columns: 12px 1fr auto 46px; gap: 8px; align-items: center; padding: 5px 0; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; }
  .legend .pc { text-align: right; opacity: .6; }
  .biglist { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .biglist li { display: flex; gap: 10px; align-items: center; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; }
  .biglist li:hover { background: #ffffff12; }
  .biglist .ic { width: 18px; height: 18px; }
  .biglist .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .biglist small { opacity: .6; font-variant-numeric: tabular-nums; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; font-size: 14px; }
  .kv dt { opacity: .6; } .kv dd { margin: 0; word-break: break-all; }
  .acts { display: grid; gap: 8px; margin-top: 20px; }
  .act { justify-content: flex-start; padding: 11px 14px; border-radius: 10px; background: #ffffff14; }
  .act:hover { background: #ffffff24; }
  .act.primary { background: #7c3aed; } .act.primary:hover { background: #8b5cf6; }

  .toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 200; background: #000c; padding: 10px 20px; border-radius: 999px; font-size: 14px; transition: opacity .3s; }
</style>
</head>

  <div class="status"><span id="time"></span><span id="drive"></span></div>
  <div class="clock"><b id="big"></b><span id="date"></span></div>
  <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-magnifying-glass"/></svg><input id="q" placeholder="ค้นหาแอป" aria-label="ค้นหาแอป"></label>
  <main class="grid" id="grid"><p class="empty">กำลังค้นหาแอปในแฟลชไดรฟ์…</p></main>
  <nav class="dock">
    <button class="app" id="openGallery" title="แกลเลอรี"><div class="icon"><svg class="ic" aria-hidden="true"><use href="#i-images-d"/></svg></div><span>แกลเลอรี</span></button>
    <button class="app" id="openMusic" title="เพลง"><div class="icon"><svg class="ic" aria-hidden="true"><use href="#i-music-notes-d"/></svg></div><span>เพลง</span></button>
    <button class="app" id="openVideos" title="วิดีโอ"><div class="icon"><svg class="ic" aria-hidden="true"><use href="#i-film-strip-d"/></svg></div><span>วิดีโอ</span></button>
    <button class="app" id="openFiles" title="ไฟล์"><div class="icon"><svg class="ic" aria-hidden="true"><use href="#i-folder-open-d"/></svg></div><span>ไฟล์</span></button>
    <button class="app" id="openSettings" title="ตั้งค่า"><div class="icon"><svg class="ic" aria-hidden="true"><use href="#i-gear-six-d"/></svg></div><span>ตั้งค่า</span></button>
    <button class="app" id="refresh" title="รีเฟรช"><div class="icon"><svg class="ic" aria-hidden="true"><use href="#i-arrows-clockwise-d"/></svg></div><span>รีเฟรช</span></button>
  </nav>

  <section class="screen" id="gallery">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><b id="galleryTitle">แกลเลอรี</b><small id="galleryCount"></small>
      <button id="resetWp" title="กลับไปใช้พื้นหลังเริ่มต้น"><svg class="ic" aria-hidden="true"><use href="#i-arrow-counter-clockwise"/></svg>วอลเปเปอร์เริ่มต้น</button></div>
    <div class="content"><div class="albums" id="galleryAlbums"></div></div>
  </section>

  <section class="screen" id="album">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><b id="albumTitle"></b><small id="albumCount"></small>
      <button id="albumFolder"><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg>เปิดโฟลเดอร์</button><button id="selectBtn"><svg class="ic" aria-hidden="true"><use href="#i-check-square"/></svg>เลือก</button></div>
    <div class="bar selbar" id="selbar" hidden><small id="selCount"></small>
      <button id="selAll"><svg class="ic" aria-hidden="true"><use href="#i-checks"/></svg>เลือกทั้งหมด</button><button id="moveSel"><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg>ย้ายไปโฟลเดอร์</button><button id="setSlide" class="primary"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg>ตั้งเป็นวอลเปเปอร์</button></div>
    <div class="content"><div class="photos" id="photos"></div></div>
  </section>

  <section class="screen" id="picker">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><b id="pkTitle"></b>
      <nav class="crumbs" id="pkCrumbs" aria-label="โฟลเดอร์ปลายทาง"></nav>
      <button id="pkHere" class="primary"><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg>ย้ายมาที่นี่</button></div>
    <div class="content"><div class="albums" id="pkDirs"></div></div>
  </section>

  <section class="screen" id="music">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><b id="musicTitle">เพลง</b><small id="musicCount"></small></div>
    <div class="content"><div class="albums" id="musicAlbums"></div></div>
  </section>

  <section class="screen" id="tracks">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><b id="tracksTitle"></b><small id="tracksCount"></small>
      <button id="playAll"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg>เล่นทั้งหมด</button><button id="shuffle"><svg class="ic" aria-hidden="true"><use href="#i-shuffle"/></svg>สุ่ม</button><button id="tracksFolder"><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg>เปิดโฟลเดอร์</button></div>
    <div class="content"><ol class="tracks" id="trackList"></ol></div>
  </section>

  <section class="screen" id="videosScreen">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><b id="videosTitle">วิดีโอ</b><small id="videosCount"></small></div>
    <div class="content"><div class="albums" id="videoAlbums"></div></div>
  </section>

  <section class="screen" id="clips">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><b id="clipsTitle"></b><small id="clipsCount"></small>
      <button id="clipsFolder"><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg>เปิดโฟลเดอร์</button></div>
    <div class="content"><div class="clips" id="clipGrid"></div></div>
  </section>

  <section class="screen" id="files">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
      <button id="fUp" class="back" title="ขึ้นไปหนึ่งระดับ (Backspace)" aria-label="ขึ้นไปหนึ่งระดับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="ตำแหน่งโฟลเดอร์"></nav>
      <button id="fExplorer"><svg class="ic" aria-hidden="true"><use href="#i-arrow-square-out"/></svg>เปิดใน Explorer</button></div>
    <div class="fwrap">
      <div class="flist">
        <div class="fhead"><span></span><button data-sort="name">ชื่อ</button><button data-sort="size">ขนาด</button><button data-sort="modified">แก้ไขล่าสุด</button></div>
        <div id="fRows"></div>
      </div>
      <aside class="finfo" id="fInfo" aria-live="polite"></aside>
    </div>
  </section>

  <section class="screen" id="settingsScreen">
    <div class="bar"><button class="back" aria-label="กลับ"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><b>ตั้งค่า</b></div>
    <div class="content settings">
      <h3>มินิเพลเยอร์ (overlay)</h3>
      <div class="row"><div><b>ตำแหน่งบนหน้าจอ</b><small>ตำแหน่งที่จะวางเมื่อพับแอป · ลากย้ายเองได้ด้วยการลากชื่อเพลง</small></div>
        <div class="screenpick" id="posPick" role="radiogroup" aria-label="ตำแหน่ง overlay">
          <button data-pos="tl" title="มุมซ้ายบน"></button><button data-pos="tr" title="มุมขวาบน"></button>
          <button data-pos="l" title="กลางขอบซ้าย"></button><button data-pos="r" title="กลางขอบขวา"></button>
          <button data-pos="bl" title="มุมซ้ายล่าง"></button><button data-pos="br" title="มุมขวาล่าง"></button>
        </div></div>
      <label class="row"><div><b>ซ่อนตามขอบจอ</b><small>เมื่อเมาส์ออก overlay จะหลบเข้าขอบจอ เหลือแถบสีเล็ก ๆ · ชี้เมาส์ที่แถบเพื่อดึงกลับ</small></div>
        <input type="checkbox" class="switch" id="edgeHide"></label>
      <h3>วอลเปเปอร์</h3>
      <label class="row"><div><b>สไลด์โชว์เปลี่ยนรูปทุก</b><small>ใช้เมื่อเลือกวอลเปเปอร์มากกว่า 1 รูป</small></div>
        <select id="interval"><option value="5">5 วินาที</option><option value="15">15 วินาที</option><option value="30">30 วินาที</option><option value="60">1 นาที</option><option value="300">5 นาที</option></select></label>
    </div>
  </section>

  <div class="viewer" id="viewer">
    <img id="viewImg" alt="">
    <button class="prev" id="vPrev" aria-label="ก่อนหน้า"><svg class="ic" aria-hidden="true"><use href="#i-caret-left"/></svg></button>
    <button class="next" id="vNext" aria-label="ถัดไป"><svg class="ic" aria-hidden="true"><use href="#i-caret-right"/></svg></button>
    <button class="setwp" id="vWp"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg>ตั้งเป็นวอลเปเปอร์</button>
    <button class="close back" aria-label="ปิด"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <div class="cap" id="cap"></div>
  </div>

  <div class="player" id="player" hidden>
    <video id="media" playsinline title="คลิกเพื่อเล่น/หยุด · ดับเบิลคลิกเพื่อขยาย"></video>
    <div class="art" id="pArt" data-tauri-drag-region><svg class="ic" aria-hidden="true"><use href="#i-music-notes-d"/></svg></div>
    <div class="info" data-tauri-drag-region><b id="pTitle"></b><small id="pAlbum"></small></div>
    <div class="pbtns"><button class="x hasvideo-only" id="pVideo" title="ซ่อนภาพ ฟังแต่เสียง" aria-label="แสดง/ซ่อนภาพวิดีโอ"><svg class="ic" aria-hidden="true"><use href="#i-eye-slash"/></svg></button><button class="x video-only" id="pBig" title="ขยายวิดีโอเต็มจอ" aria-label="ขยายวิดีโอ"><svg class="ic" aria-hidden="true"><use href="#i-corners-out"/></svg></button><button class="x" id="pMini" title="พับเป็นมินิเพลเยอร์ที่ขอบจอ" aria-label="พับเป็นมินิเพลเยอร์"><svg class="ic" aria-hidden="true"><use href="#i-picture-in-picture"/></svg></button><button class="x" id="pClose" title="ปิดเพลง" aria-label="ปิดเพลง"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="ctl">
      <button id="pPrev" aria-label="ก่อนหน้า"><svg class="ic" aria-hidden="true"><use href="#i-skip-back-f"/></svg></button>
      <button id="pPlay" class="pp" aria-label="เล่น/หยุด"><svg class="ic" aria-hidden="true"><use href="#i-pause-f"/></svg></button>
      <button id="pNext" aria-label="ถัดไป"><svg class="ic" aria-hidden="true"><use href="#i-skip-forward-f"/></svg></button>
      <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="ตำแหน่งเพลง">
      <time id="pTime">0:00</time>
      <button id="pRepeat" class="sm" aria-label="วนซ้ำ"><svg class="ic" aria-hidden="true"><use href="#i-repeat"/></svg></button>
      <button id="pQueue" class="sm" title="คิว" aria-label="คิว"><svg class="ic" aria-hidden="true"><use href="#i-queue"/></svg></button>
    </div>
  </div>
  <div class="queue" id="queue" hidden>
    <div class="qhead"><b id="queueCount"></b><button id="queueClear">ล้างคิว</button></div>
    <ol id="queueList"></ol>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
