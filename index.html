<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Flashdrive Home</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: #fff; user-select: none; }
  body { background: radial-gradient(circle at 20% 10%, #4f46e5, transparent 50%), radial-gradient(circle at 90% 90%, #db2777, transparent 45%), #0f172a; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .status { display: flex; justify-content: space-between; padding: 8px 20px; font-size: 14px; opacity: .9; }
  .clock { text-align: center; margin: 24px 0 12px; }
  .clock b { display: block; font-size: 64px; font-weight: 300; }
  .search { display: block; width: min(560px, 90%); margin: 0 auto 20px; padding: 12px 20px; border-radius: 999px; border: 0; font-size: 16px; background: #ffffffe6; color: #111; outline: none; }

  .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 20px 8px; align-content: start; padding: 8px 32px 24px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 4px; border-radius: 16px; }
  .app:hover, .app:focus-visible { background: #ffffff22; outline: none; }
  .app:active { transform: scale(.94); }
  .icon { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; font-weight: 600; background: #ffffffee; box-shadow: 0 4px 12px #0005; overflow: hidden; }
  .icon img { width: 48px; height: 48px; image-rendering: auto; }
  .app span { font-size: 13px; text-align: center; text-shadow: 0 1px 3px #000a; max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { grid-column: 1 / -1; text-align: center; opacity: .8; padding: 40px; }

  .dock { display: flex; justify-content: center; gap: 24px; margin: 0 auto 16px; padding: 10px 28px; border-radius: 28px; background: #ffffff2e; backdrop-filter: blur(16px); }
  .dock .app span { display: none; }

  /* Gallery "app" — full screen like an Android activity */
  .screen { position: fixed; inset: 0; background: #111; display: none; flex-direction: column; }
  .screen.open { display: flex; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #1c1c1e; font-size: 18px; }
  .bar button { font-size: 24px; width: 40px; height: 40px; border-radius: 50%; }
  .bar button:hover { background: #ffffff22; }
  .bar small { opacity: .6; margin-left: auto; font-size: 14px; }
  .photos { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 3px; padding: 3px; align-content: start; }
  .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; cursor: pointer; display: block; }

  .viewer { position: fixed; inset: 0; background: #000; display: none; place-items: center; }
  .viewer.open { display: grid; }
  .viewer img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  .viewer button { position: absolute; font-size: 40px; width: 64px; height: 64px; border-radius: 50%; background: #0006; }
  .viewer .prev { left: 16px; } .viewer .next { right: 16px; }
  .viewer .close { top: 16px; right: 16px; font-size: 28px; }
  .viewer .cap { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
  <div class="status"><span id="time"></span><span id="drive"></span></div>
  <div class="clock"><b id="big"></b><span id="date"></span></div>
  <input class="search" id="q" placeholder="🔍 ค้นหาแอป" aria-label="ค้นหาแอป">
  <main class="grid" id="grid"><p class="empty">กำลังค้นหาแอปในแฟลชไดรฟ์…</p></main>
  <nav class="dock">
    <button class="app" id="openGallery" title="แกลเลอรี"><div class="icon">🖼️</div><span>แกลเลอรี</span></button>
    <button class="app" id="openFiles" title="ไฟล์"><div class="icon">📁</div><span>ไฟล์</span></button>
    <button class="app" id="refresh" title="รีเฟรช"><div class="icon">🔄</div><span>รีเฟรช</span></button>
  </nav>

  <section class="screen" id="gallery">
    <div class="bar"><button id="back" aria-label="กลับ">←</button>แกลเลอรี<small id="count"></small></div>
    <div class="photos" id="photos"></div>
  </section>

  <div class="viewer" id="viewer">
    <img id="big-img" alt="">
    <button class="prev" aria-label="ก่อนหน้า">‹</button>
    <button class="next" aria-label="ถัดไป">›</button>
    <button class="close" aria-label="ปิด">✕</button>
    <div class="cap" id="cap"></div>
  </div>

<script>
const $ = id => document.getElementById(id);
let root = '', apps = [], images = [], cur = 0;

// --- clock ---
function tick() {
  const d = new Date();
  const t = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  $('time').textContent = t; $('big').textContent = t;
  $('date').textContent = d.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' });
}
tick(); setInterval(tick, 10000);

// --- home screen ---
function renderApps() {
  const q = $('q').value.trim().toLowerCase();
  const list = apps.filter(a => a.name.toLowerCase().includes(q));
  $('grid').replaceChildren(...list.map(a => {
    const b = document.createElement('button');
    b.className = 'app'; b.title = a.path;
    const icon = document.createElement('div'); icon.className = 'icon';
    if (a.icon) { const img = new Image(); img.src = a.icon; icon.append(img); }
    else { icon.textContent = a.name[0].toUpperCase(); icon.style.color = '#4f46e5'; }
    const label = document.createElement('span'); label.textContent = a.name;
    b.append(icon, label);
    b.onclick = () => window.api.open(a.path);
    return b;
  }));
  if (!list.length) $('grid').innerHTML = `<p class="empty">${apps.length ? 'ไม่พบแอปที่ค้นหา' : 'ไม่พบแอปในแฟลชไดรฟ์ (.exe, .lnk, .bat, .AppImage, .app)'}</p>`;
}

async function load() {
  root = (await window.api.info()).root;
  $('drive').textContent = '💾 ' + root;
  apps = (await window.api.apps()).sort((a, b) => a.name.localeCompare(b.name));
  renderApps();
}

$('q').oninput = renderApps;
$('refresh').onclick = () => { images = []; load(); };
$('openFiles').onclick = () => window.api.open(root);

// --- gallery ---
$('openGallery').onclick = async () => {
  $('gallery').classList.add('open');
  if (!images.length) {
    $('count').textContent = 'กำลังโหลด…';
    images = await window.api.images();
    $('photos').replaceChildren(...images.map((im, i) => {
      const img = new Image(); img.loading = 'lazy'; img.src = im.url; img.alt = im.name; img.title = im.name;
      img.onclick = () => show(i);
      return img;
    }));
  }
  $('count').textContent = images.length ? images.length + ' รูป' : 'ไม่พบรูปภาพ';
};
$('back').onclick = () => $('gallery').classList.remove('open');

function show(i) {
  cur = (i + images.length) % images.length;
  $('big-img').src = images[cur].url;
  $('cap').textContent = `${images[cur].name}  ·  ${cur + 1}/${images.length}`;
  $('viewer').classList.add('open');
}
const closeViewer = () => $('viewer').classList.remove('open');
document.querySelector('.prev').onclick = () => show(cur - 1);
document.querySelector('.next').onclick = () => show(cur + 1);
document.querySelector('.close').onclick = closeViewer;

// Android-like back (Esc) and arrow keys
document.onkeydown = e => {
  if ($('viewer').classList.contains('open')) {
    if (e.key === 'ArrowLeft') show(cur - 1);
    else if (e.key === 'ArrowRight') show(cur + 1);
    else if (e.key === 'Escape') closeViewer();
  } else if (e.key === 'Escape') $('gallery').classList.remove('open');
};

// swipe left/right on touch screens
let x0 = null;
$('viewer').addEventListener('touchstart', e => x0 = e.touches[0].clientX);
$('viewer').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
});

load();
</script>
</body>
</html>
